name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        # -tags=integration so integration/golden-only code is exercised and not
        # reported as 0% — honest coverage (this run also covers the golden tests).
        run: go test -race -tags=integration -covermode=atomic -coverprofile=coverage.out ./...

      - name: Integration / golden tests (no-coverage sanity run)
        run: go test -race -tags=integration ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  docs:
    name: docs (link-rot gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build matlatl
        run: go build -o bin/matlatl ./cmd/matlatl
      # Dogfood: matlatl checks its OWN docs for broken links/anchors and
      # orphaned/unreachable pages. Fixtures under testdata/ are excluded by the
      # repo-root .matlatlignore, so this gate sees only the real docs.
      - name: Doc link-rot gate (matlatl check . --strict)
        run: ./bin/matlatl check . --strict
