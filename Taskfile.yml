# matlatl developer Taskfile — https://taskfile.dev
version: "3"

vars:
  BINARY: matlatl
  PKG: ./...
  BIN_DIR: bin
  GOFLAGS: '{{.GOFLAGS | default ""}}'

tasks:
  default:
    desc: Show this help
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the matlatl binary into ./bin
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build {{.GOFLAGS}} -o {{.BIN_DIR}}/{{.BINARY}} ./cmd/matlatl

  install:
    desc: Install matlatl into GOBIN
    cmds:
      - go install {{.GOFLAGS}} ./cmd/matlatl

  test:
    desc: Run unit + smoke tests
    cmds:
      - go test {{.GOFLAGS}} -race -count=1 {{.PKG}}

  test-performance:
    desc: Run the full-scale 5k-document memory guard without race instrumentation
    cmds:
      - go test {{.GOFLAGS}} -tags=performance -count=1 -run '^TestPipeline_5kDocs_MemoryCeiling$' -v ./internal/application

  test-integration:
    desc: Run integration / golden tests
    cmds:
      - go test {{.GOFLAGS}} -race -count=1 -tags=integration {{.PKG}}

  cover:
    desc: Run tests with coverage report (includes integration/golden code)
    cmds:
      - go test {{.GOFLAGS}} -tags=integration -race -covermode=atomic -coverprofile=coverage.out {{.PKG}}
      - go tool cover -func=coverage.out | tail -1

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.PKG}}

  lint:
    desc: Run golangci-lint (must be installed)
    cmds:
      - golangci-lint run

  tidy:
    desc: Tidy and verify modules
    cmds:
      - go mod tidy
      - go mod verify

  fmt:
    desc: Format the codebase
    cmds:
      - gofmt -s -w .

  docs:
    desc: "Doc link-rot gate: matlatl checks its own repo docs (strict)"
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} check . --strict

  llms:
    desc: Regenerate the repo-root llms.txt from the project's own docs
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.BINARY}} index . --llms --title "{{.BINARY}}" > llms.txt

  dogfood:
    desc: "Eat the dog food: regenerate llms.txt + run the strict doc gate"
    cmds:
      - task: llms
      - task: docs

  eval:validate:
    desc: Validate offline eval v1 tasks and fixtures
    cmds:
      - go run ./eval/cmd/eval validate --root eval

  eval:oracle:
    desc: Check the canonical fixture against its hand-authored oracle
    cmds:
      - go run ./eval/cmd/eval oracle --root eval

  eval:smoke:
    desc: Run the deterministic offline eval smoke path with temporary output
    cmds:
      - sh -c 'tmp=$(mktemp -d); trap "rm -rf $tmp" EXIT; go run ./eval/cmd/eval smoke --root eval --out "$tmp"'

  eval:report:
    desc: Render a validated report to persistent eval/out/report.md
    cmds:
      - sh -c 'tmp=$(mktemp -d); trap "rm -rf $tmp" EXIT; go run ./eval/cmd/eval smoke --root eval --out "$tmp/records"; go run ./eval/cmd/eval report --records "$tmp/records" --out eval/out'

  eval:nimbus-validate:
    desc: Validate strict Nimbus calibration manifests and fixtures
    cmds:
      - go run ./eval/cmd/eval nimbus validate --root eval/nimbus/v1

  eval:nimbus-freeze-check:
    desc: Verify the canonical Nimbus byte/hash inventory
    cmds:
      - go run ./eval/cmd/eval nimbus freeze --root eval/nimbus/v1

  eval:nimbus-verify:
    desc: Pull the pinned verifier and score all Nimbus patch fixtures in locked containers
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: "eval:nimbus-verify requires Linux"
      - sh: command -v "${MATLATL_OCI_RUNTIME:-}" >/dev/null 2>&1
        msg: "set MATLATL_OCI_RUNTIME=docker|podman and install/start that executable"
    cmds:
      - go run ./eval/cmd/eval nimbus verify --root eval/nimbus/v1 --runtime "${MATLATL_OCI_RUNTIME:?set MATLATL_OCI_RUNTIME to docker or podman}" --prepare

  eval:nimbus-probe:
    desc: Run OCI-free deterministic Nimbus topology, access, transport, and telemetry probes
    cmds:
      - go run ./eval/cmd/eval nimbus probe --root eval/nimbus/v1

  eval:nimbus-oci-integration:
    desc: Run Nimbus verifier/isolation acceptance with Docker or rootless Podman
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: "eval:nimbus-oci-integration requires Linux"
    cmds:
      - go test -tags=ociintegration -count=1 -run TestBlackBoxVerifierOCI -v ./eval/internal/nimbus
      - go test -tags=ociintegration -count=1 -run 'TestOCIIsolationEndToEnd' -v ./eval/internal/agentoutcome

  eval:agent-spike:
    desc: Run offline isolated-executor unit tests with a fake OCI seam
    cmds:
      - go test -race -count=1 ./eval/...

  eval:oci-integration:
    desc: Build the scratch fake image and run adversarial OCI isolation acceptance
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: "eval:oci-integration requires Linux; OCI isolation is not supported on this platform"
    cmds:
      - go test -tags=ociintegration -count=1 -run TestOCIIsolationEndToEnd -v ./eval/internal/agentoutcome

  eval:smevals-smoke:
    desc: Run opt-in external smevals smoke through the isolated scratch image (network required for smevals only)
    preconditions:
      - sh: command -v uv >/dev/null && command -v uvx >/dev/null
        msg: "eval:smevals-smoke requires uv and uvx"
    cmds:
      - sh -c 'set -eu; tmp=$(mktemp -d); built=$(go run ./eval/cmd/smevals-adapter image "$PWD"); runtime=${built%% *}; rest=${built#* }; image=${rest%% *}; tag=${rest#* }; cleanup() { status=$?; "$runtime" image rm --force "$tag" >/dev/null 2>&1 || status=1; if "$runtime" image inspect "$tag" >/dev/null 2>&1; then status=1; fi; rm -rf "$tmp"; exit "$status"; }; trap cleanup EXIT; MATLATL_OCI_RUNTIME="$runtime" MATLATL_OCI_IMAGE="$image" uvx --from "git+https://github.com/prime-radiant-inc/smevals.git@0c28dc6298eb0e6c3b47e296e82a6972a01d76d0" smevals run eval/agent-outcome -c baseline -m test/offline-fake -g --runs-dir "$tmp"; MATLATL_OCI_RUNTIME="$runtime" MATLATL_OCI_IMAGE="$image" uvx --from "git+https://github.com/prime-radiant-inc/smevals.git@0c28dc6298eb0e6c3b47e296e82a6972a01d76d0" smevals run eval/agent-outcome -c all -m test/offline-fake -g --runs-dir "$tmp"'

  check:
    desc: Run the full local verification suite
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} coverage.out out
